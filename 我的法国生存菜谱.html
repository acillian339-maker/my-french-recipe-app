<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f0">
<title>我的法国生存菜谱</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8f0;color:#302a27;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}
button,input{font:inherit}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:78px}
header{padding:24px 18px 12px}
h1{margin:0;font-size:25px}.sub{margin-top:6px;color:#8a7770;font-size:13px}
.search{margin:12px 18px;background:white;border:1px solid #eaded5;border-radius:16px;padding:12px 14px;display:flex;gap:8px}
.search input{border:0;outline:0;width:100%;background:transparent}
.tabs{display:flex;gap:8px;overflow:auto;padding:0 18px 14px}.tabs button{border:1px solid #eaded5;background:white;border-radius:999px;padding:8px 13px;white-space:nowrap}.tabs .on{background:#302a27;color:white}
.page{padding:0 18px}.card{background:white;border:1px solid #eaded5;border-radius:20px;padding:17px;margin-bottom:13px;box-shadow:0 4px 15px #6b514010}.tag{font-size:12px;color:#a25d3e}.card h2{margin:7px 0}.meta{font-size:13px;color:#8a7770}.primary{width:100%;border:0;border-radius:14px;background:#302a27;color:white;padding:12px;margin-top:12px}
.detail{display:none;padding:0 18px}.back{border:0;background:none;padding:4px 0 12px;font-size:15px}
.detail h2{font-size:25px;margin:5px 0}.info{color:#8a7770;font-size:13px}.section{background:white;border:1px solid #eaded5;border-radius:18px;padding:15px;margin:12px 0}.section h3{margin:0 0 10px}
.servings{display:flex;align-items:center;gap:12px}.servings button{width:38px;height:38px;border-radius:50%;border:1px solid #ddd;background:#fff}.qty{font-weight:700;min-width:30px;text-align:center}
li{margin:8px 0;line-height:1.5}.notes{color:#6f625d;font-size:13px;line-height:1.6}
.ingredients{display:none;padding:0 18px}.ingredient{display:flex;align-items:center;background:white;border:1px solid #eaded5;border-radius:14px;padding:11px;margin:8px 0}.ingredient input{margin-right:10px}
.empty{padding:30px 8px;text-align:center;color:#8a7770}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfb;border-top:1px solid #eaded5;display:flex;justify-content:center;z-index:5}
nav button{border:0;background:none;padding:12px 30px;color:#8a7770}nav .active{color:#302a27;font-weight:700}
</style>
</head>
<body>
<div class="app">
<header><h1>🍳 我的法国生存菜谱</h1><div class="sub">一个人也要好好吃饭。</div></header>

<div id="home">
<div class="search">🔎 <input id="search" placeholder="搜菜名、食材……" oninput="render()"></div>
<div class="tabs">
<button class="on" onclick="setCat('全部',this)">全部</button><button onclick="setCat('面食',this)">🍜 面食</button><button onclick="setCat('下饭',this)">🍚 下饭</button><button onclick="setCat('懒人',this)">🥱 懒人</button>
</div>
<div class="page" id="cards"></div>
</div>

<div id="detail" class="detail"></div>
<div id="ingredients" class="ingredients">
<h2>🧊 我现在有什么？</h2><div class="sub">勾选你手边有的食材，以后可以用来筛菜。</div>
<div id="ingList"></div>
</div>

<nav><button id="navHome" class="active" onclick="showHome()">🍜<br>菜谱</button><button id="navIng" onclick="showIng()">🧊<br>我的食材</button></nav>
</div>

<script>
const recipes=[
{id:1,name:"酸辣拌龙须面",cat:["面食","懒人"],time:"15 分钟",difficulty:"⭐⭐",lazy:"⭐⭐⭐⭐⭐",
ingredients:[
["龙须面",90,"g"],["生菜",4,"片"],["胡萝卜丝",30,"g"],["大蒜",2,"瓣"],
["生抽",15,"ml"],["陈醋",15,"ml"],["芝麻酱",15,"g"],["辣椒油",5,"ml"],["白糖",2.5,"g"],["香油",2.5,"ml"],["面汤",40,"ml"]
],
steps:["先把生抽、陈醋、芝麻酱、辣椒油、白糖和香油放进碗里。","龙须面煮熟后留一点面汤，用热面汤把芝麻酱调开。","胡萝卜丝和生菜下锅焯约 20–30 秒。","面条沥干，和蔬菜、酱汁一起拌匀。喜欢辣一点就再加辣椒油。"],
note:"想加肉：牛肉末 50–70g 或鸡腿肉 70–80g，炒熟后铺在面上。"}
];

const pantry=["洋葱","大蒜","胡萝卜丝","龙须面","粿条片","生菜","蘑菇","番茄","青椒","鸡腿肉","牛肉末/牛肉饼","土豆丝","生抽","老抽","陈醋","十三香","老干妈","辣椒油","芝麻酱","蘑菇酱","料酒","豆瓣酱","香油"];
let cat="全部", servings=1, current=null;

function setCat(c,b){cat=c;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render()}
function render(){
const q=document.getElementById("search").value.trim().toLowerCase();
let arr=recipes.filter(r=>(cat==="全部"||r.cat.includes(cat))&&(!q||r.name.toLowerCase().includes(q)||r.ingredients.some(x=>x[0].toLowerCase().includes(q))));
document.getElementById("cards").innerHTML=arr.length?arr.map(r=>`<div class="card"><div class="tag">${r.cat.join(" · ")}</div><h2>${r.name}</h2><div class="meta">⏱ ${r.time}　难度 ${r.difficulty}　懒人指数 ${r.lazy}</div><button class="primary" onclick="openRecipe(${r.id})">查看做法 →</button></div>`).join(""):`<div class="empty">还没有找到这道菜～</div>`;
}
function openRecipe(id){
current=recipes.find(r=>r.id===id);servings=1;
document.getElementById("home").style.display="none";document.getElementById("ingredients").style.display="none";document.getElementById("detail").style.display="block";
document.getElementById("detail").innerHTML=`<button class="back" onclick="showHome()">← 返回菜谱</button><h2>${current.name}</h2><div class="info">⏱ ${current.time}　难度 ${current.difficulty}</div>
<div class="section"><h3>👤 几个人吃？</h3><div class="servings"><button onclick="changeServ(-1)">−</button><div class="qty" id="serv">1</div><button onclick="changeServ(1)">＋</button></div></div>
<div class="section"><h3>🥬 食材</h3><ul id="ings"></ul></div>
<div class="section"><h3>👩‍🍳 做法</h3><ol>${current.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>
<div class="section"><h3>💡 小贴士</h3><div class="notes">${current.note}</div></div>`;
updateQty();
}
function changeServ(n){servings=Math.max(1,Math.min(8,servings+n));document.getElementById("serv").textContent=servings;updateQty()}
function updateQty(){document.getElementById("ings").innerHTML=current.ingredients.map(x=>`<li><b>${nice(x[1]*servings)} ${x[2]}</b> ${x[0]}</li>`).join("")}
function nice(n){return Number.isInteger(n)?n:(Math.round(n*10)/10)}
function showHome(){document.getElementById("home").style.display="block";document.getElementById("detail").style.display="none";document.getElementById("ingredients").style.display="none";document.getElementById("navHome").classList.add("active");document.getElementById("navIng").classList.remove("active");render()}
function showIng(){document.getElementById("home").style.display="none";document.getElementById("detail").style.display="none";document.getElementById("ingredients").style.display="block";document.getElementById("navHome").classList.remove("active");document.getElementById("navIng").classList.add("active");renderIng()}
function renderIng(){document.getElementById("ingList").innerHTML=pantry.map((x,i)=>`<label class="ingredient"><input type="checkbox" id="i${i}"> ${x}</label>`).join("")}
render();renderIng();
</script>
</body></html>
